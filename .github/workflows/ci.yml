name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ghc graphviz libblas-dev liblapack-dev libocct-data-exchange-dev
      - name: Install Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '*.cabal') }}
          restore-keys: |
            stack-${{ runner.os }}-
      - name: Build
        run: stack --system-ghc build
